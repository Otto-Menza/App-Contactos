<section class="actions py-4 mb-4">
    <div class="container w-30">
        <a href="#" class="btn btn-primary w-30" data-bs-toggle="modal" data-bs-target="#agregarContactoModal">
            <i class="bt bi-plus-circle"></i> Agregar Cliente
        </a>
    </div>
</section>
<section class="container d-flex flex-column gap-5">
    <div class="container d-flex gap-5">
        @for(contacto of contactos; track contacto){
            <div class="card w-30">
                <div class="card-header d-flex">
                    <h4>{{contacto.nombre}} {{contacto.apellido}}</h4>
                    <a routerLink="/cliente/editar/{{contacto.id}}" class="btn btn secundaty">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                </div>
                <div class="card-body text-center p-1">{{contacto.telefono}}</div>
            </div>
        }
    </div>
    <div class="card bg-info col-md-3">
        <div class="card-body d-flex gap-2 justify-content-center align-items-center ">
            <h3 class="m-0">Contactos:</h3>
            <p class="display-6 m-0">{{contactos?.length}}</p>
        </div>
    </div>
</section>
<!-- Modal para Agregar Modal -->
 <div class="modal fade" id="agregarContactoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-tittle">Agregar Contacto</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- Formulario: -->
             <form>
                <div class="modal-body d-flex flex-column gap-3">
                    <div class="d-flex align-items-center-mb-3">
                        <label for="nombre" class="form-label me-3" style="min-width: 100px">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control">
                    </div>
                    <div class="d-flex align-items-center-mb-3">
                        <label for="apellido" class="form-label me-3" style="min-width: 100px">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-control">
                    </div>
                    <div class="d-flex align-items-center-mb-3">
                        <label for="email" class="form-label me-3" style="min-width: 100px">Email</label>
                        <input type="text" id="email" name="email" class="form-control">
                    </div>
                    <div class="d-flex align-items-center-mb-3">
                        <label for="email" class="form-label me-3" style="min-width: 100px">Telefono</label>
                        <input type="number" id="telefono" name="telefono" class="form-control">
                    </div>
                    <!-- Footer -->
                     <div class="modal-footer">
                        <button class="btn btn-primary" type="submit">Guardar</button>
                     </div>
                </div>
             </form>
        </div>
    </div>
 </div>
